services:
  - type: web
    name: minglebot-command-center
    runtime: docker
    plan: starter
    region: oregon
    healthCheckPath: /api/status
    envVars:
      - key: HEADLESS_MODE
        value: "true"
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "8000"
    disk:
      name: minglebot-data
      mountPath: /app/data
      sizeGB: 1
